name: Build card index

# Gera o índice slim de nomes a partir do bulk do Scryfall e publica como release de tag fixa
# (card-index). O app (repositório privado, à parte) baixa manifest.json + card-index.ndjson.gz ou
# card-index-delta.ndjson.gz dessa release — por isso este repositório é público.
# Roda 1x por semana e sob demanda (workflow_dispatch). Ver scripts/build-card-index.mjs.

on:
  schedule:
    - cron: '17 6 * * 1' # toda segunda, 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write # criar/atualizar a release e seus assets

concurrency:
  group: card-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Base do delta: o índice publicado no build anterior. Na primeira vez (ou se a release ainda
      # não tem os arquivos) segue sem delta e o app baixa o completo.
      - name: Baixa o índice anterior (p/ o delta)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download card-index -p 'card-index.ndjson.gz' -p 'manifest.json' -D prev || exit 0
          mv prev/card-index.ndjson.gz prev-card-index.ndjson.gz
          mv prev/manifest.json prev-manifest.json

      - name: Gera o índice
        run: node scripts/build-card-index.mjs

      - name: Publica na release card-index
        uses: softprops/action-gh-release@v2
        with:
          tag_name: card-index
          name: Índice de cartas (slim)
          body: Índice local de nomes gerado automaticamente do bulk do Scryfall.
          files: |
            card-index.ndjson.gz
            card-index-delta.ndjson.gz
            manifest.json
